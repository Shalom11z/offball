name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust kernels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/offball-core
      - name: Format
        working-directory: rust/offball-core
        run: cargo fmt --check
      - name: Clippy
        working-directory: rust/offball-core
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: rust/offball-core
        run: cargo test

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[api,dev]'
      - name: Lint
        working-directory: python
        run: ruff check src tests
      - name: Test (pure-Python kernels)
        working-directory: python
        run: pytest -q

  parity:
    name: Rust/Python kernel parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/offball-core
      - name: Install Python package
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[api,dev]'
      # `maturin develop` requires an activated virtualenv, which the runner
      # does not have. Installing the crate directly lets pip's build
      # isolation drive maturin as the build backend instead.
      - name: Build and install compiled kernels
        run: pip install ./rust/offball-core
      # The parity suite skips itself when the extension is absent, so assert
      # it is actually present before trusting a green run.
      - name: Verify the compiled backend is active
        working-directory: python
        run: |
          python -c "import offball; assert offball.BACKEND == 'rust', offball.BACKEND"
      - name: Test (compiled kernels + parity)
        working-directory: python
        run: pytest -q

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  sql:
    name: SQL schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          for f in sql/*.sql; do
            echo "== $f"
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Re-apply to confirm idempotency
        env:
          PGPASSWORD: postgres
        run: |
          for f in sql/*.sql; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"
          done
